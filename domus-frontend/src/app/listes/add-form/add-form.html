<form #f="ngForm" (ngSubmit)="submit(f)">
  @if (context === 'item') {
    <input type="text"
           id="item-input"
           name="item"
           [(ngModel)]="newItemText"
           (input)="searchSuggestions()"
           (change)="maybeAddSuggestion()"
           list="item-suggestions"
           placeholder="Ajouter un item">
    <datalist id="item-suggestions">
      @let suggestionList = suggestions();
      @if (suggestionList.kind === 'item') {
        @for (s of suggestionList.values; track s.id) {
          <option [value]="s.text"></option>
        }
      }
    </datalist>
  } @else {
    <input type="text" [(ngModel)]="newName" name="name" placeholder="Nom de la liste">
    <input type="text"
           [(ngModel)]="tagInput"
           name="tag"
           (input)="searchSuggestions()"
           list="tag-suggestions"
           placeholder="Tag (ex: course, été)">
    <datalist id="tag-suggestions">
      @let tagSuggestionList = suggestions();
      @if (tagSuggestionList.kind === 'tag') {
        @for (t of tagSuggestionList.values; track t) {
          <option [value]="t"></option>
        }
      }
    </datalist>
  }
  <button type="submit">Ajouter</button>
</form>
